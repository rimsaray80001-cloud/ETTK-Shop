<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>ស្មាតសប អ៊េចប្រេស ត្រាំកក់</title>
    <style>
        :root { --primary: #219E42; --secondary: #1a73e8; --danger: #e74c3c; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Kantumruy Pro', sans-serif; margin: 0; display: flex; background: var(--bg); }
        
        /* Sidebar Navigation */
        .sidebar { width: 260px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 25px; box-sizing: border-box; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar h2 { font-size: 19px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-top: 0; }
        .sidebar p { font-size: 14px; opacity: 0.8; }
        
        /* Main Content Area */
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); box-sizing: border-box; }
        
        /* M-o-M Stats Display */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-card small { color: #666; font-weight: 600; }
        .stat-card .val { font-size: 28px; font-weight: 700; color: var(--primary); margin: 8px 0; display: block; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge-up { background: #e8f5e9; color: var(--primary); }
        .badge-down { background: #fdecea; color: var(--danger); }

        /* Form Card */
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #eee; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; }
        .field { display: grid; gap: 5px; }
        .field label { font-size: 13px; font-weight: 600; color: #555; }
        input { padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; font-family: inherit; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary); }

        /* Buttons */
        .btn-save { background: var(--primary); color: white; width: 100%; margin-top: 20px; cursor: pointer; border: none; border-radius: 10px; padding: 14px; font-family: inherit; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-save:hover { background: #1a7d34; }
        .btn-refresh { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-family: inherit; margin-top: 15px; font-weight: 600; }

        /* Data Table */
        .table-container { overflow-x: auto; background: white; border-radius: 15px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 13px; color: #64748b; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .action-icon { cursor: pointer; margin-right: 12px; font-size: 16px; }
        .action-icon.edit { color: var(--secondary); }
        .action-icon.delete { color: var(--danger); }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>ស្មាតសប អ៊េចប្រេស</h2>
    <p>សាខា: ត្រាំកក់</p>
    <hr style="border:0.5px solid rgba(255,255,255,0.1)">
    <button class="btn-refresh" onclick="loadData()"><i class="fa-solid fa-sync"></i> Refresh Data</button>
</div>

<div class="main">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="card">
        <h3 id="formTitle" style="margin-top:0; color: var(--primary);">បញ្ចូលទិន្នន័យប្រចាំថ្ងៃ</h3>
        <div class="input-grid">
            <div class="field"><label>ថ្ងៃខែ</label><input type="date" id="date"></div>
            <div class="field"><label>ភ្នាក់ងារ</label><input type="text" id="agent"></div>
            <div class="field"><label>Gross</label><input type="number" id="gross"></div>
            <div class="field"><label>Sim</label><input type="number" id="sim"></div>
            <div class="field"><label>TopUp ($)</label><input type="number" id="topup"></div>
            <div class="field"><label>Shop ($)</label><input type="number" id="shop"></div>
            <div class="field"><label>Dealer ($)</label><input type="number" id="dealer"></div>
            <div class="field"><label>សរុប ($)</label><input type="number" id="totalrev" style="border: 2px solid var(--primary); font-weight:bold;"></div>
        </div>
        <button class="btn-save" id="saveBtn" onclick="saveData()">រក្សាទុកទិន្នន័យ</button>
        <div class="loader" id="loader"></div>
    </div>

    <div class="card" style="padding:0">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ថ្ងៃខែ</th>
                        <th>ភ្នាក់ងារ</th>
                        <th>Gross/Sim</th>
                        <th>T/S/D ($)</th>
                        <th>សរុប ($)</th>
                        <th>សកម្មភាព</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyVmsOGm-20o8qnz0fgATA7vmEO48AbaCHjP0WfUjYp6Y4GUxpEi0TXa5jBH02EWbAFTg/exec";
    let state = { store: [], editIndex: null };

    document.getElementById('date').valueAsDate = new Date();

    async function loadData() {
        document.getElementById('loader').style.display = "block";
        try {
            const res = await fetch(API);
            state.store = await res.json();
            render();
        } catch (e) { alert("Error connecting to API!"); }
        document.getElementById('loader').style.display = "none";
    }

    function render() {
        const now = new Date();
        const tDay = now.getDate(), tMonth = now.getMonth() + 1, tYear = now.getFullYear();
        const preMonth = tMonth === 1 ? 12 : tMonth - 1;
        const preYear = tMonth === 1 ? tYear - 1 : tYear;

        let curV = 0, preV = 0, curG = 0, preG = 0;
        const body = document.getElementById('tableBody');
        body.innerHTML = "";

        // Render from newest to oldest
        [...state.store].reverse().forEach(i => {
            const p = (i.date || "").split(/[-T/]/);
            if(p.length < 3) return;
            const iy = parseInt(p[0]), im = parseInt(p[1]), id = parseInt(p[2]);

            // M-o-M Comparison Logic
            if (im === tMonth && iy === tYear) { curV += parseFloat(i.totalrev || 0); curG += parseFloat(i.gross || 0); }
            if (im === preMonth && iy === preYear && id <= tDay) { preV += parseFloat(i.totalrev || 0); preG += parseFloat(i.gross || 0); }

            body.innerHTML += `<tr>
                <td>${i.date.substring(0,10)}</td>
                <td><b>${i.agent}</b></td>
                <td>${i.gross} / ${i.sim}</td>
                <td>${i.topup} / ${i.shop} / ${i.dealer}</td>
                <td style="color:var(--primary); font-weight:700">$${parseFloat(i.totalrev||0).toFixed(2)}</td>
                <td>
                    <i class="fa-solid fa-pen-to-square action-icon edit" onclick="editRow(${i.rowindex})" title="Edit"></i>
                    <i class="fa-solid fa-trash action-icon delete" onclick="deleteRow(${i.rowindex})" title="Delete"></i>
                </td>
            </tr>`;
        });
        renderCards(curV, preV, curG, preG, tDay);
    }

    function renderCards(cv, pv, cg, pg, day) {
        const build = (title, val, old, is$) => {
            const diff = val - old, pct = old > 0 ? ((diff / old) * 100).toFixed(0) : 0, up = diff >= 0;
            return `
                <div class="stat-card">
                    <small>${title} (ត្រឹមថ្ងៃទី ${day})</small>
                    <span class="val">${is$ ? '$' : ''}${val.toLocaleString()}</span>
                    <span class="badge ${up ? 'badge-up' : 'badge-down'}">
                        <i class="fa-solid fa-arrow-${up ? 'up' : 'down'}"></i> ${up ? '+' : ''}${pct}%
                    </span>
                    <span style="font-size:12px; color:#999; margin-left:5px">ខែមុន: ${old.toLocaleString()}</span>
                </div>`;
        };
        document.getElementById('statsGrid').innerHTML = build("ចំណូលសរុបខែនេះ", cv, pv, true) + build("Gross សរុបខែនេះ", cg, pg, false);
    }

    async function saveData() {
        const agent = document.getElementById('agent').value;
        if(!agent) return alert("សូមបញ្ចូលឈ្មោះភ្នាក់ងារ!");

        document.getElementById('loader').style.display = "block";
        const payload = {
            action: state.editIndex ? "UPDATE" : "ADD",
            rowIndex: state.editIndex,
            date: document.getElementById('date').value,
            agent: agent,
            gross: document.getElementById('gross').value || 0,
            sim: document.getElementById('sim').value || 0,
            topup: document.getElementById('topup').value || 0,
            shop: document.getElementById('shop').value || 0,
            dealer: document.getElementById('dealer').value || 0,
            totalrev: document.getElementById('totalrev').value || 0
        };

        try {
            await fetch(API, { method: "POST", body: JSON.stringify(payload) });
            state.editIndex = null;
            document.getElementById('formTitle').innerText = "បញ្ចូលទិន្នន័យប្រចាំថ្ងៃ";
            loadData();
            // Clear inputs except date
            document.querySelectorAll('input').forEach(i => i.id !== 'date' ? i.value="" : null);
        } catch (e) { alert("Save Failed!"); }
        document.getElementById('loader').style.display = "none";
    }

    function editRow(idx) {
        const item = state.store.find(i => i.rowindex === idx);
        state.editIndex = idx;
        document.getElementById('formTitle').innerText = "កែសម្រួលទិន្នន័យជួរទី " + idx;
        document.getElementById('date').value = (item.date||"").substring(0,10);
        document.getElementById('agent').value = item.agent;
        document.getElementById('gross').value = item.gross;
        document.getElementById('sim').value = item.sim;
        document.getElementById('topup').value = item.topup;
        document.getElementById('shop').value = item.shop;
        document.getElementById('dealer').value = item.dealer;
        document.getElementById('totalrev').value = item.totalrev;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function deleteRow(idx) {
        if(confirm("តើអ្នកច្បាស់ទេថានឹងលុបទិន្នន័យជួរទី " + idx + "?")) {
            document.getElementById('loader').style.display = "block";
            await fetch(API, { method: "POST", body: JSON.stringify({action: "DELETE", rowIndex: idx}) });
            loadData();
        }
    }

    loadData();
</script>
</body>
</html>
