<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>ស្មាតសប អ៊េចប្រេស ត្រាំកក់</title>
    <style>
        :root { --primary: #219E42; --bg: #f8fafc; --white: #ffffff; }
        body { font-family: 'Kantumruy Pro', sans-serif; margin: 0; background: var(--bg); display: flex; }

        /* Sidebar Recovery */
        .sidebar { width: 260px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 19px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-top: 0; text-align: center; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 13px 15px; color: white; text-decoration: none; border-radius: 10px; margin-bottom: 5px; cursor: pointer; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.2); }
        .nav-item i { width: 20px; font-size: 18px; }

        /* Main Content */
        .main { margin-left: 260px; padding: 35px; width: calc(100% - 260px); box-sizing: border-box; }
        
        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; border-left: 5px solid var(--primary); }
        .stat-card i { position: absolute; right: 20px; top: 25px; font-size: 30px; color: var(--primary); opacity: 0.15; }
        .stat-card small { color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        .stat-card .val { font-size: 30px; font-weight: 700; color: #1e293b; margin: 10px 0; display: block; }

        /* Form Card */
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border: 1px solid #edf2f7; }
        .card h3 { margin-top: 0; margin-bottom: 20px; color: #334155; display: flex; align-items: center; gap: 10px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 13px; font-weight: 600; color: #64748b; }
        input { padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(33, 158, 66, 0.1); }

        .btn-save { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-family: inherit; font-weight: 700; width: 100%; margin-top: 20px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-save:hover { background: #1a7d34; transform: translateY(-1px); }

        /* Table */
        .table-container { overflow-x: auto; background: white; border-radius: 15px; border: 1px solid #edf2f7; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: #f8fafc; padding: 15px 20px; text-align: left; font-size: 13px; color: #64748b; border-bottom: 2px solid #edf2f7; }
        td { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .action-btns { display: flex; gap: 12px; }
        .edit-btn { color: #1a73e8; cursor: pointer; }
        .delete-btn { color: #e74c3c; cursor: pointer; }

        .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loading-overlay" id="loader"><div class="spinner"></div></div>

<div class="sidebar">
    <h2>ស្មាតសប ត្រាំកក់</h2>
    <div class="nav-item active"><i class="fa-solid fa-chart-pie"></i> ដាសបត</div>
    <div class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i> ការលក់ប្រចាំថ្ងៃ</div>
    <div class="nav-item"><i class="fa-solid fa-hand-holding-dollar"></i> ការដាក់ប្រាក់</div>
    <div class="nav-item" onclick="loadData()"><i class="fa-solid fa-arrows-rotate"></i> អាប់ដេតទិន្នន័យ</div>
    
    <div style="margin-top: auto; font-size: 11px; opacity: 0.5; text-align: center;">SmartShop v4.0.1</div>
</div>

<div class="main">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="card">
        <h3 id="formTitle"><i class="fa-solid fa-pen-to-square"></i> បញ្ចូលទិន្នន័យថ្មី</h3>
        <div class="input-grid">
            <div class="field"><label>ថ្ងៃខែ</label><input type="date" id="date"></div>
            <div class="field"><label>ភ្នាក់ងារ</label><input type="text" id="agent"></div>
            <div class="field"><label>Gross</label><input type="number" id="gross"></div>
            <div class="field"><label>Sim</label><input type="number" id="sim"></div>
            <div class="field"><label>TopUp ($)</label><input type="number" id="topup"></div>
            <div class="field"><label>Shop ($)</label><input type="number" id="shop"></div>
            <div class="field"><label>Dealer ($)</label><input type="number" id="dealer"></div>
            <div class="field"><label>សរុប ($)</label><input type="number" id="totalrev" style="border: 2px solid var(--primary); font-weight: 700;"></div>
        </div>
        <button class="btn-save" id="saveBtn" onclick="saveData()">រក្សាទុកទិន្នន័យ</button>
    </div>

    <div class="card" style="padding:0">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ថ្ងៃខែ</th>
                        <th>ភ្នាក់ងារ</th>
                        <th>Gross/Sim</th>
                        <th>T/S/D ($)</th>
                        <th>សរុប ($)</th>
                        <th>សកម្មភាព</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // URL ថ្មីដែលលោកអ្នកបានផ្តល់ឱ្យ
    const API = "https://script.google.com/macros/s/AKfycbzh-7yVCZHwkI1JWSqrqOj0YA1eO_ZDPiy6u4N-RNL7VMruvUb3P-3HpbKLzS8HAnlhmA/exec";
    let state = { store: [], editIndex: null };

    document.getElementById('date').valueAsDate = new Date();

    async function loadData() {
        toggleLoader(true);
        try {
            const res = await fetch(API);
            state.store = await res.json();
            render();
        } catch (e) { alert("មិនអាចទាញទិន្នន័យពី URL ថ្មីបានទេ!"); }
        toggleLoader(false);
    }

    function render() {
        const now = new Date();
        const tMonth = now.getMonth() + 1, tYear = now.getFullYear();
        let curV = 0, curG = 0;
        const body = document.getElementById('tableBody');
        body.innerHTML = "";

        // បង្ហាញពីថ្មីទៅចាស់
        [...state.store].reverse().forEach(i => {
            const p = (i.date || "").split(/[-T/]/);
            if(p.length < 3) return;
            
            if (parseInt(p[1]) === tMonth && parseInt(p[0]) === tYear) {
                curV += parseFloat(i.totalrev || 0);
                curG += parseFloat(i.gross || 0);
            }

            body.innerHTML += `<tr>
                <td>${i.date.substring(0,10)}</td>
                <td><b>${i.agent}</b></td>
                <td>${i.gross} / ${i.sim}</td>
                <td>${i.topup} / ${i.shop} / ${i.dealer}</td>
                <td><span style="color:var(--primary); font-weight:700">$${parseFloat(i.totalrev||0).toFixed(2)}</span></td>
                <td>
                    <div class="action-btns">
                        <i class="fa-solid fa-edit edit-btn" onclick="editRow(${i.rowindex})"></i>
                        <i class="fa-solid fa-trash delete-btn" onclick="deleteRow(${i.rowindex})"></i>
                    </div>
                </td>
            </tr>`;
        });

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><i class="fa-solid fa-sack-dollar"></i><small>ចំណូលសរុបខែនេះ</small><span class="val">$${curV.toLocaleString()}</span></div>
            <div class="stat-card"><i class="fa-solid fa-chart-line"></i><small>Gross សរុបខែនេះ</small><span class="val">${curG.toLocaleString()}</span></div>
        `;
    }

    async function saveData() {
        const agent = document.getElementById('agent').value;
        if(!agent) return alert("សូមបញ្ចូលឈ្មោះភ្នាក់ងារ!");
        
        toggleLoader(true);
        const payload = {
            action: state.editIndex ? "UPDATE" : "ADD",
            rowIndex: state.editIndex,
            date: document.getElementById('date').value,
            agent: agent,
            gross: document.getElementById('gross').value || 0,
            sim: document.getElementById('sim').value || 0,
            topup: document.getElementById('topup').value || 0,
            shop: document.getElementById('shop').value || 0,
            dealer: document.getElementById('dealer').value || 0,
            totalrev: document.getElementById('totalrev').value || 0
        };

        try {
            await fetch(API, { method: "POST", body: JSON.stringify(payload) });
            state.editIndex = null;
            document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-pen-to-square'></i> បញ្ចូលទិន្នន័យថ្មី";
            document.getElementById('saveBtn').innerText = "រក្សាទុកទិន្នន័យ";
            loadData();
            document.querySelectorAll('input').forEach(i => i.id !== 'date' ? i.value = "" : null);
        } catch (e) { alert("បញ្ហាពេលរក្សាទុក!"); }
        toggleLoader(false);
    }

    function editRow(idx) {
        const item = state.store.find(i => i.rowindex === idx);
        state.editIndex = idx;
        document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-edit'></i> កែសម្រួលទិន្នន័យជួរទី " + idx;
        document.getElementById('saveBtn').innerText = "ធ្វើបច្ចុប្បន្នភាព";
        document.getElementById('date').value = (item.date||"").substring(0,10);
        document.getElementById('agent').value = item.agent;
        document.getElementById('gross').value = item.gross;
        document.getElementById('sim').value = item.sim;
        document.getElementById('topup').value = item.topup;
        document.getElementById('shop').value = item.shop;
        document.getElementById('dealer').value = item.dealer;
        document.getElementById('totalrev').value = item.totalrev;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    async function deleteRow(idx) {
        if(confirm("តើអ្នកចង់លុបទិន្នន័យជួរទី " + idx + " នេះមែនទេ?")) {
            toggleLoader(true);
            await fetch(API, { method: "POST", body: JSON.stringify({action: "DELETE", rowIndex: idx}) });
            loadData();
        }
    }

    function toggleLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

    loadData();
</script>
</body>
</html>
