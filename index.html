<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>ស្មាតសប អ៊េចប្រេស ត្រាំកក់</title>
    <style>
        :root { --primary: #219E42; --accent: #15803d; --bg: #f1f5f9; --sidebar-width: 260px; }
        body { font-family: 'Kantumruy Pro', sans-serif; margin: 0; background: var(--bg); display: flex; color: #1e293b; }

        /* Sidebar Styling */
        .sidebar { width: var(--sidebar-width); background: var(--primary); color: white; height: 100vh; position: fixed; padding: 2rem 1rem; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 1.2rem; text-align: center; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1rem; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: white; text-decoration: none; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.2); }

        /* Main Content */
        .main-content { margin-left: var(--sidebar-width); padding: 2.5rem; width: 100%; box-sizing: border-box; }
        .section { display: none; }
        .section.active { display: block; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .stat-card .val { font-size: 1.8rem; font-weight: 700; color: var(--primary); display: block; margin-top: 5px; }

        /* Form Card */
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input { padding: 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
        input:focus { border-color: var(--primary); outline: none; }

        .btn-save { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; margin-top: 1rem; }

        /* Table Styling */
        .table-wrap { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 1rem; text-align: left; font-size: 0.8rem; color: #64748b; }
        td { padding: 1rem; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; }

        .loader { display: none; text-align: center; color: var(--primary); font-weight: 700; padding: 1rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>ស្មាតសប ត្រាំកក់</h2>
    <div class="nav-link active" onclick="showSection('dashboard', this)"><i class="fa-solid fa-chart-pie"></i> ដាសបត</div>
    <div class="nav-link" onclick="showSection('sales', this)"><i class="fa-solid fa-cart-plus"></i> ការលក់ប្រចាំថ្ងៃ</div>
    <div class="nav-link"><i class="fa-solid fa-list-check"></i> បញ្ជីមុខទំនិញ</div>
    <div class="nav-link"><i class="fa-solid fa-money-bill-transfer"></i> ការដាក់ប្រាក់</div>
</div>

<div class="main-content">
    
    <div id="dashboard" class="section active">
        <h1>ផ្ទាំងសង្ខេប (Dashboard)</h1>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="table-wrap">
            <h3 style="padding: 1.5rem 0 0 1.5rem; margin: 0;">ទិន្នន័យលក់ចុងក្រោយ</h3>
            <table>
                <thead>
                    <tr><th>ថ្ងៃខែ</th><th>ភ្នាក់ងារ</th><th>G/S</th><th>សរុប ($)</th></tr>
                </thead>
                <tbody id="dashTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="sales" class="section">
        <h1>ការលក់ប្រចាំថ្ងៃ (Input Data)</h1>
        <div class="card">
            <h3 id="formHeader"><i class="fa-solid fa-plus-circle"></i> បញ្ចូលទិន្នន័យថ្មី</h3>
            <div class="form-grid">
                <div class="input-group"><label>ថ្ងៃខែ</label><input type="date" id="date"></div>
                <div class="input-group"><label>ភ្នាក់ងារ</label><input type="text" id="agent"></div>
                <div class="input-group"><label>Gross</label><input type="number" id="gross"></div>
                <div class="input-group"><label>Sim</label><input type="number" id="sim"></div>
                <div class="input-group"><label>TopUp</label><input type="number" id="topup"></div>
                <div class="input-group"><label>Shop</label><input type="number" id="shop"></div>
                <div class="input-group"><label>Dealer</label><input type="number" id="dealer"></div>
                <div class="input-group"><label>សរុប ($)</label><input type="number" id="totalrev" style="font-weight: bold; border-color: var(--primary);"></div>
            </div>
            <button class="btn-save" id="submitBtn" onclick="handleSave()">រក្សាទុកការលក់</button>
            <div id="loader"><i class="fa-solid fa-spinner fa-spin"></i> កំពុងដំណើរការ...</div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ថ្ងៃខែ</th><th>ភ្នាក់ងារ</th><th>T/S/D</th><th>សរុប ($)</th><th>សកម្មភាព</th></tr>
                </thead>
                <tbody id="salesTableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzh-7yVCZHwkI1JWSqrqOj0YA1eO_ZDPiy6u4N-RNL7VMruvUb3P-3HpbKLzS8HAnlhmA/exec";
    let appData = [];
    let editId = null;

    // Switch Sections
    function showSection(id, el) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    // Initial Load
    window.onload = () => {
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    };

    async function loadData() {
        document.getElementById('loader').style.display = "block";
        try {
            const res = await fetch(API_URL);
            appData = await res.json();
            renderAll();
        } catch (e) { alert("Load Failed!"); }
        document.getElementById('loader').style.display = "none";
    }

    function renderAll() {
        const dashBody = document.getElementById('dashTableBody');
        const salesBody = document.getElementById('salesTableBody');
        dashBody.innerHTML = ""; salesBody.innerHTML = "";
        
        let totalRev = 0, totalGross = 0;

        [...appData].reverse().forEach(row => {
            totalRev += parseFloat(row.totalrev || 0);
            totalGross += parseFloat(row.gross || 0);

            // Render Dashboard Table (Simple)
            dashBody.innerHTML += `<tr>
                <td>${row.date.split('T')[0]}</td>
                <td>${row.agent}</td>
                <td>${row.gross}/${row.sim}</td>
                <td><strong>$${parseFloat(row.totalrev).toFixed(2)}</strong></td>
            </tr>`;

            // Render Sales Table (Full + Action)
            salesBody.innerHTML += `<tr>
                <td>${row.date.split('T')[0]}</td>
                <td>${row.agent}</td>
                <td>${row.topup}/${row.shop}/${row.dealer}</td>
                <td><strong>$${parseFloat(row.totalrev).toFixed(2)}</strong></td>
                <td>
                    <i class="fa-solid fa-edit" style="color:blue; cursor:pointer;" onclick="editRow(${row.rowindex})"></i> | 
                    <i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="deleteRow(${row.rowindex})"></i>
                </td>
            </tr>`;
        });

        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><small>ចំណូលសរុបខែនេះ</small><span class="val">$${totalRev.toLocaleString()}</span></div>
            <div class="stat-card"><small>Gross សរុបខែនេះ</small><span class="val">${totalGross.toLocaleString()}</span></div>
        `;
    }

    async function handleSave() {
        const agent = document.getElementById('agent').value;
        if(!agent) return alert("បញ្ចូលឈ្មោះភ្នាក់ងារ!");

        document.getElementById('loader').style.display = "block";
        const payload = {
            action: editId ? "UPDATE" : "ADD",
            rowIndex: editId,
            date: document.getElementById('date').value,
            agent: agent,
            gross: document.getElementById('gross').value || 0,
            sim: document.getElementById('sim').value || 0,
            topup: document.getElementById('topup').value || 0,
            shop: document.getElementById('shop').value || 0,
            dealer: document.getElementById('dealer').value || 0,
            totalrev: document.getElementById('totalrev').value || 0
        };

        await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        editId = null;
        document.getElementById('formHeader').innerText = "បញ្ចូលទិន្នន័យថ្មី";
        resetForm();
        loadData();
    }

    function editRow(id) {
        const item = appData.find(i => i.rowindex === id);
        editId = id;
        document.getElementById('formHeader').innerText = "កែសម្រួលជួរទី " + id;
        document.getElementById('date').value = item.date.split('T')[0];
        document.getElementById('agent').value = item.agent;
        document.getElementById('gross').value = item.gross;
        document.getElementById('sim').value = item.sim;
        document.getElementById('topup').value = item.topup;
        document.getElementById('shop').value = item.shop;
        document.getElementById('dealer').value = item.dealer;
        document.getElementById('totalrev').value = item.totalrev;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteRow(id) {
        if(!confirm("លុបជួរទី " + id + "?")) return;
        document.getElementById('loader').style.display = "block";
        await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "DELETE", rowIndex: id }) });
        loadData();
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(i => i.id !== 'date' ? i.value = "" : null);
    }
</script>
</body>
</html>
