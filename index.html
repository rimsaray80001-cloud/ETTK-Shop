<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>ស្មាតសប អ៊េចប្រេស ត្រាំកក់ - Full Management System</title>
    <style>
        :root { 
            --primary: #219E42; 
            --danger: #e74c3c; 
            --warning: #f39c12; 
            --bg: #f4f7f6; 
            --unit: #1a73e8; 
            --curr: #e67e22; 
            --white: #ffffff; 
            --dark: #2c3e50;
        }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            margin: 0; 
            display: flex; 
            background: var(--bg); 
            min-height: 100vh; 
            color: #333; 
        }
        
        /* Sidebar Navigation */
        .sidebar { 
            width: 260px; 
            background: var(--primary); 
            height: 100vh; 
            position: fixed; 
            padding: 40px 15px; 
            box-sizing: border-box; 
            color: white; 
            z-index: 100; 
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar h2 { 
            font-size: 19px; 
            margin-bottom: 30px; 
            font-weight: 700; 
            text-align: center; 
            border-bottom: 1px solid rgba(255,255,255,0.2); 
            padding-bottom: 15px; 
            line-height: 1.6;
        }
        .nav-btn { 
            width: 100%; 
            padding: 14px 15px; 
            margin-bottom: 10px; 
            border: none; 
            background: transparent; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: left; 
            font-family: inherit; 
            font-size: 15px; 
            color: rgba(255,255,255,0.85); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: all 0.3s ease; 
        }
        .nav-btn i { font-size: 18px; width: 25px; text-align: center; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-btn.active { 
            background: var(--white); 
            color: var(--primary); 
            font-weight: 700; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        /* Main Content Area */
        .main { 
            margin-left: 260px; 
            padding: 30px; 
            width: calc(100% - 260px); 
            box-sizing: border-box; 
        }

        /* Dashboard Header & Filter */
        .dashboard-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        .dashboard-header h1 { 
            font-size: 22px; 
            margin: 0; 
            color: var(--dark); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .filter-group { 
            display: flex; 
            background: #e2e8f0; 
            padding: 5px; 
            border-radius: 15px; 
            gap: 5px; 
        }
        .filter-btn { 
            border: none; 
            padding: 10px 18px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 13px; 
            font-weight: 600; 
            color: #64748b;
            transition: 0.3s; 
        }
        .filter-btn.active { 
            background: var(--white); 
            color: var(--primary); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
        }

        /* Stats Grid Cards */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            margin-bottom: 35px; 
        }
        .stat-card { 
            background: var(--white); 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); 
            border-bottom: 5px solid #eee; 
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h4 { 
            margin: 0; 
            font-size: 14px; 
            color: #7f8c8d; 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .stat-card .val { 
            font-size: 24px; 
            font-weight: 700; 
            margin: 12px 0; 
            display: block; 
            color: var(--dark);
        }
        .stat-card .diff { 
            font-size: 13px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .up { color: var(--primary); }
        .down { color: var(--danger); }
        .no-change { color: #95a5a6; }

        /* Form Styling */
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            margin-bottom: 30px; 
        }
        h3 { 
            border-left: 5px solid var(--primary); 
            padding-left: 15px; 
            font-size: 18px; 
            color: var(--primary); 
            margin: 0 0 25px 0; 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        .compact-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            margin-bottom: 15px; 
        }
        .field { display: flex; flex-direction: column; }
        .field label { 
            font-size: 13px; 
            margin-bottom: 8px; 
            color: #555; 
            font-weight: 600; 
        }
        input { 
            padding: 12px 15px; 
            border: 2px solid #edf2f7; 
            border-radius: 12px; 
            font-family: inherit; 
            font-size: 14px;
            outline: none; 
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(33, 158, 66, 0.1); }
        
        .btn-save { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 14px 40px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-family: inherit;
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-left: auto; 
            transition: 0.3s;
        }
        .btn-save:hover { background: #1a8235; transform: scale(1.02); }

        /* Table Design */
        .table-container { 
            overflow-x: auto; 
            border-radius: 15px; 
            background: white; 
            border: 1px solid #edf2f7; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { 
            background: #f8fafc; 
            padding: 18px 15px; 
            text-align: left; 
            font-size: 13px; 
            color: #64748b; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #edf2f7;
        }
        td { padding: 16px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: middle; }
        tr:hover { background-color: #fcfdfe; }
        
        /* Action Buttons in Table */
        .action-btns { display: flex; gap: 10px; }
        .icon-btn { 
            width: 36px; 
            height: 36px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s; 
            font-size: 15px; 
        }
        .edit-btn { background: #fff9db; color: #f59f00; }
        .del-btn { background: #fff5f5; color: #fa5252; }
        .edit-btn:hover { background: #f59f00; color: white; }
        .del-btn:hover { background: #fa5252; color: white; }

        /* Status & Toasts */
        #status { 
            position: fixed; 
            top: 25px; 
            right: 25px; 
            padding: 18px 30px; 
            border-radius: 15px; 
            color: white; 
            font-weight: 600; 
            z-index: 1001; 
            display: none; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2><i class="fa-solid fa-store"></i> ស្មាតសប អ៊េចប្រេស<br>ត្រាំកក់</h2>
    <button class="nav-btn active" id="menu-sales" onclick="showTab('sales', this)">
        <i class="fa-solid fa-chart-line"></i> ការលក់ប្រចាំថ្ងៃ
    </button>
    <button class="nav-btn" id="menu-deposit" onclick="showTab('deposit', this)">
        <i class="fa-solid fa-wallet"></i> ការដាក់ប្រាក់
    </button>
</div>

<div class="main">
    <div id="status"></div>

    <div class="dashboard-header">
        <div>
            <h1><i class="fa-solid fa-gauge-high"></i> Dashboard វិភាគការលក់</h1>
            <small id="rangeLabel" style="color: #888; font-weight: 500; font-size: 13px;"></small>
        </div>
        <div class="filter-group">
            <button class="filter-btn active" onclick="setRange('MOM', this)">តាមថ្ងៃខែ (M-o-M)</button>
            <button class="filter-btn" onclick="setRange(7, this)">7 ថ្ងៃចុងក្រោយ</button>
            <button class="filter-btn" onclick="setRange(30, this)">30 ថ្ងៃចុងក្រោយ</button>
        </div>
    </div>

    <div class="stats-grid" id="dashboardStats">
        </div>

    <div id="salesTab">
        <div class="card">
            <h3 id="formTitleSales"><i class="fa-solid fa-cart-plus"></i> បញ្ចូលការលក់ប្រចាំថ្ងៃ</h3>
            <div class="compact-grid">
                <div class="field"><label>ថ្ងៃខែឆ្នាំ</label><input type="date" id="sDate"></div>
                <div class="field"><label>ភ្នាក់ងារ</label><input type="text" id="sAgent" placeholder="ឈ្មោះភ្នាក់ងារ..."></div>
                <div class="field"><label style="color:var(--unit)">Ads/Gross</label><input type="number" id="uAds" value="0"></div>
                <div class="field"><label style="color:var(--unit)">Sim</label><input type="number" id="uSim" value="0"></div>
            </div>
            <div class="compact-grid">
                <div class="field"><label style="color:var(--unit)">Home</label><input type="number" id="uHome" value="0"></div>
                <div class="field"><label style="color:var(--unit)">Fiber</label><input type="number" id="uFiber" value="0"></div>
                <div class="field"><label style="color:var(--curr)">Top Up ($)</label><input type="number" id="rTopup" value="0"></div>
                <div class="field"><label style="color:var(--curr)">SC Shop ($)</label><input type="number" id="rShop" value="0"></div>
            </div>
            <div class="compact-grid">
                <div class="field"><label style="color:var(--curr)">SC Dealer ($)</label><input type="number" id="rDealer" value="0"></div>
                <div class="field"><label style="color:var(--primary)">សរុបការលក់ ($)</label><input type="number" id="rTotal" value="0" style="background:#f0fdf4; font-weight:700; color:var(--primary); border-color: var(--primary);"></div>
                <div class="field"></div><div class="field"></div>
            </div>
            <button class="btn-save" onclick="save('Sales')"><i class="fa-solid fa-floppy-disk"></i> រក្សាទុកទិន្នន័យ</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ថ្ងៃខែ</th>
                        <th>ភ្នាក់ងារ</th>
                        <th style="color:var(--unit)">Unit (A/S/H/F)</th>
                        <th style="color:var(--curr)">Curr (T/S/D)</th>
                        <th style="color:var(--primary)">សរុប $</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="salBody"></tbody>
            </table>
        </div>
    </div>

    <div id="depositTab" class="hidden">
        <div class="card">
            <h3 id="formTitleDep"><i class="fa-solid fa-money-bill-transfer"></i> បញ្ចូលការដាក់ប្រាក់</h3>
            <div class="compact-grid">
                <div class="field"><label>ថ្ងៃខែឆ្នាំ</label><input type="date" id="dDate"></div>
                <div class="field"><label>ភ្នាក់ងារ</label><input type="text" id="dAgent" placeholder="ឈ្មោះភ្នាក់ងារ..."></div>
                <div class="field"><label>Cash ($)</label><input type="number" id="dCash" value="0"></div>
                <div class="field"><label>Credit ($)</label><input type="number" id="dCredit" value="0"></div>
            </div>
            <button class="btn-save" onclick="save('Deposit')"><i class="fa-solid fa-floppy-disk"></i> រក្សាទុកទិន្នន័យ</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ថ្ងៃខែ</th>
                        <th>ភ្នាក់ងារ</th>
                        <th>Cash ($)</th>
                        <th>Credit ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="depBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbx1B-HwEH2XmsC-8L4U72sE6w7tOWfCw86l8-tzDh023O0ImMU5BoeN-J07Ag6-8pT0/exec";
    let state = { store: [], range: 'MOM', isEdit: false, editIdx: null };

    // Tab Navigation System
    function showTab(t, b) {
        document.getElementById('depositTab').classList.toggle('hidden', t !== 'deposit');
        document.getElementById('salesTab').classList.toggle('hidden', t !== 'sales');
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        resetForm();
    }

    // Dashboard Range Filter System
    function setRange(r, b) {
        state.range = r;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        updateDashboard();
    }

    // Load Data from Google Sheets
    async function load() {
        showMsg("⏳ កំពុងទាញទិន្នន័យ...", "var(--unit)");
        try {
            const res = await fetch(API);
            state.store = await res.json();
            render();
            updateDashboard();
            document.getElementById('status').style.display = 'none';
        } catch(e) { 
            showMsg("❌ មិនអាចភ្ជាប់ទៅកាន់ Server!", "var(--danger)"); 
        }
    }

    // Dashboard Analysis Logic
    function updateDashboard() {
        const now = new Date();
        let curS = {total:0, sim:0, gross:0, fiber:0}, preS = {total:0, sim:0, gross:0, fiber:0};
        
        if(state.range === 'MOM') {
            const todayDay = now.getDate();
            const thisM = now.getMonth()+1, thisY = now.getFullYear();
            const lastM = thisM === 1 ? 12 : thisM - 1, lastY = thisM === 1 ? thisY-1 : thisY;
            
            curS = calc(thisM, thisY, 1, 31);
            preS = calc(lastM, lastY, 1, todayDay);
            document.getElementById('rangeLabel').innerHTML = `<i class="fa-solid fa-calendar-day"></i> ប្រៀបធៀបចន្លោះថ្ងៃទី ១ ដល់ ${todayDay} នៃខែមុន`;
        } else {
            const days = parseInt(state.range);
            const curEnd = new Date(), curStart = new Date(); curStart.setDate(curEnd.getDate() - days + 1);
            const preEnd = new Date(); preEnd.setDate(curStart.getDate() - 1);
            const preStart = new Date(); preStart.setDate(preEnd.getDate() - days + 1);

            curS = calcByRange(curStart, curEnd);
            preS = calcByRange(preStart, preEnd);
            document.getElementById('rangeLabel').innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> ប្រៀបធៀប ${days} ថ្ងៃចុងក្រោយ ធៀបនឹង ${days} ថ្ងៃមុននោះ`;
        }

        // Calculation Helper Functions
        function calc(m, y, d1, d2) {
            let res = {total:0, sim:0, gross:0, fiber:0};
            state.store.filter(i => i.recordType === 'Sales' && i.date).forEach(i => {
                const [iy, im, id] = i.date.split('-').map(Number);
                if(im === m && iy === y && id >= d1 && id <= d2) {
                    res.total += parseFloat(i.totalRev || 0); 
                    res.sim += parseFloat(i.sim || 0); 
                    res.gross += parseFloat(i.gross || 0); 
                    res.fiber += parseFloat(i.fiber || 0);
                }
            });
            return res;
        }

        function calcByRange(start, end) {
            let res = {total:0, sim:0, gross:0, fiber:0};
            state.store.filter(i => i.recordType === 'Sales' && i.date).forEach(i => {
                const d = new Date(i.date);
                if(d >= start && d <= end) {
                    res.total += parseFloat(i.totalRev || 0); 
                    res.sim += parseFloat(i.sim || 0); 
                    res.gross += parseFloat(i.gross || 0); 
                    res.fiber += parseFloat(i.fiber || 0);
                }
            });
            return res;
        }

        // UI Card Rendering
        const createCard = (title, icon, cv, pv, isC, col) => {
            const diff = cv - pv;
            const per = pv > 0 ? Math.round((diff/pv)*100) : (cv > 0 ? 100 : 0);
            const statusClass = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'no-change');
            const trendIcon = diff > 0 ? 'fa-arrow-trend-up' : (diff < 0 ? 'fa-arrow-trend-down' : 'fa-minus');

            return `
                <div class="stat-card" style="border-bottom-color:${col}">
                    <h4><i class="${icon}"></i> ${title}</h4>
                    <span class="val">${isC?'$':''}${cv.toLocaleString()}</span>
                    <div class="diff ${statusClass}">
                        <i class="fa-solid ${trendIcon}"></i> 
                        ${Math.abs(per)}% 
                        <small style="color:#aaa; font-weight:400; margin-left:4px;">(ធៀបគ្រាមុន: ${pv.toLocaleString()})</small>
                    </div>
                </div>`;
        };

        document.getElementById('dashboardStats').innerHTML = 
            createCard("ចំណូលសរុប", "fa-solid fa-money-bill-wave", curS.total, preS.total, true, "var(--primary)") +
            createCard("ស៊ីមសរុប", "fa-solid fa-sim-card", curS.sim, preS.sim, false, "var(--unit)") +
            createCard("Gross សរុប", "fa-solid fa-tower-broadcast", curS.gross, preS.gross, false, "var(--warning)") +
            createCard("Fiber សរុប", "fa-solid fa-network-wired", curS.fiber, preS.fiber, false, "var(--curr)");
    }

    // Render Data into Tables
    function render() {
        const dBody = document.getElementById('depBody'), sBody = document.getElementById('salBody');
        dBody.innerHTML = sBody.innerHTML = "";
        
        state.store.forEach(item => {
            const row = `<tr>
                <td>${item.date}</td>
                <td><b>${item.agent}</b></td>
                ${item.recordType === 'Deposit' ? 
                `<td>$${parseFloat(item.cash).toLocaleString()}</td><td>$${parseFloat(item.credit).toLocaleString()}</td>` : 
                `<td style="color:var(--unit)">${item.gross}/${item.sim}/${item.home}/${item.fiber}</td>
                 <td style="color:var(--curr)">${item.topup}/${item.shop}/${item.dealer}</td>
                 <td style="color:var(--primary); font-weight:700;">$${parseFloat(item.totalRev).toFixed(2)}</td>`}
                <td>
                    <div class="action-btns">
                        <button class="icon-btn edit-btn" onclick="startEdit('${item.recordType}', ${item.rowIndex})"><i class="fa-solid fa-pen"></i></button>
                        <button class="icon-btn del-btn" onclick="del('${item.recordType}', ${item.rowIndex})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
            if(item.recordType === "Deposit") dBody.innerHTML += row; else sBody.innerHTML += row;
        });
    }

    // Edit Functionality
    function startEdit(type, idx) {
        const item = state.store.find(i => i.recordType === type && i.rowIndex === idx);
        state.isEdit = true; 
        state.editIdx = idx;
        
        if(type === 'Deposit') {
            document.getElementById('dDate').value = item.date;
            document.getElementById('dAgent').value = item.agent;
            document.getElementById('dCash').value = item.cash;
            document.getElementById('dCredit').value = item.credit;
            document.getElementById('formTitleDep').innerHTML = "<i class='fa-solid fa-pen-to-square'></i> កែប្រែទិន្នន័យដាក់ប្រាក់";
        } else {
            document.getElementById('sDate').value = item.date;
            document.getElementById('sAgent').value = item.agent;
            document.getElementById('uAds').value = item.gross;
            document.getElementById('uSim').value = item.sim;
            document.getElementById('uHome').value = item.home;
            document.getElementById('uFiber').value = item.fiber;
            document.getElementById('rTopup').value = item.topup;
            document.getElementById('rShop').value = item.shop;
            document.getElementById('rDealer').value = item.dealer;
            document.getElementById('rTotal').value = item.totalRev;
            document.getElementById('formTitleSales').innerHTML = "<i class='fa-solid fa-pen-to-square'></i> កែប្រែទិន្នន័យលក់";
        }
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // Save & Update Functionality
    async function save(type) {
        const obj = { 
            recordType: type, 
            action: state.isEdit ? "UPDATE" : "ADD", 
            rowIndex: state.editIdx,
            date: document.getElementById(type === 'Deposit' ? 'dDate' : 'sDate').value, 
            agent: document.getElementById(type === 'Deposit' ? 'dAgent' : 'sAgent').value 
        };

        if(!obj.date || !obj.agent) {
            alert("សូមបំពេញថ្ងៃខែ និងឈ្មោះភ្នាក់ងារឱ្យបានត្រឹមត្រូវ!");
            return;
        }
        
        if(type === 'Deposit') {
            obj.cash = document.getElementById('dCash').value;
            obj.credit = document.getElementById('dCredit').value;
        } else {
            obj.gross = document.getElementById('uAds').value;
            obj.sim = document.getElementById('uSim').value;
            obj.home = document.getElementById('uHome').value;
            obj.fiber = document.getElementById('uFiber').value;
            obj.topup = document.getElementById('rTopup').value;
            obj.shop = document.getElementById('rShop').value;
            obj.dealer = document.getElementById('rDealer').value;
            obj.totalRev = document.getElementById('rTotal').value;
        }
        
        // Optimistic UI Update
        if(state.isEdit) {
            const idx = state.store.findIndex(i => i.recordType === type && i.rowIndex === state.editIdx);
            if(idx > -1) state.store[idx] = { ...state.store[idx], ...obj };
        } else {
            state.store.unshift({ ...obj, rowIndex: Date.now() }); 
        }

        render(); 
        updateDashboard(); 
        resetForm();
        showMsg("✅ រក្សាទុកជោគជ័យ!", "var(--primary)");

        // Server Sync
        try {
            await fetch(API, { method: "POST", body: JSON.stringify(obj) });
            load(); // Reload to ensure data integrity
        } catch(e) { showMsg("❌ Error syncing to cloud!", "var(--danger)"); }
    }

    // Delete Functionality
    async function del(type, idx) {
        if(!confirm("តើអ្នកចង់លុបទិន្នន័យនេះមែនទេ?")) return;
        state.store = state.store.filter(i => !(i.recordType === type && i.rowIndex === idx));
        render(); 
        updateDashboard();
        showMsg("🗑️ ទិន្នន័យត្រូវបានលុប!", "var(--danger)");
        
        try {
            await fetch(API, { method: "POST", body: JSON.stringify({action: "DELETE", recordType: type, rowIndex: idx}) });
            load();
        } catch(e) { showMsg("❌ Error deleting!", "var(--danger)"); }
    }

    // Helper: Reset Form
    function resetForm() {
        state.isEdit = false; 
        state.editIdx = null;
        document.querySelectorAll('input').forEach(i => {
            if(i.type === 'number') i.value = 0;
            else if(i.type !== 'date') i.value = "";
        });
        document.getElementById('formTitleSales').innerHTML = "<i class='fa-solid fa-cart-plus'></i> បញ្ចូលការលក់ប្រចាំថ្ងៃ";
        document.getElementById('formTitleDep').innerHTML = "<i class='fa-solid fa-money-bill-transfer'></i> បញ្ចូលការដាក់ប្រាក់";
    }

    // Helper: Show Message Toast
    function showMsg(t, c) {
        const s = document.getElementById('status');
        s.style.display = 'block'; 
        s.innerText = t; 
        s.style.background = c.startsWith('var') ? c : `var(--${c})`;
        setTimeout(() => s.style.display = 'none', 3000);
    }

    // Initialize App
    window.onload = load;
</script>
</body>
</html>
